<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The People's Ledger POC</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>The People's Ledger</h1>
        <p>Milestones 1 and 2 proof of concept</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <main>
      <section class="panel">
        <h2>TCJA Analysis Unit</h2>
        <div id="analysis" class="content">Start the backend with <code>make run</code>.</div>
      </section>
      <section class="panel">
        <h2>Source Registry</h2>
        <div id="sources" class="content"></div>
      </section>
      <section class="panel">
        <h2>AI Decision Ledger</h2>
        <div class="toolbar">
          <button id="summarize" type="button">Run deterministic summary</button>
        </div>
        <pre id="ledger" class="content"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
