name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bundled data
        run: make validate

      - name: Run assurance gate
        run: make assure

      - name: Run Phase 1 acceptance checks
        run: make phase1-acceptance

      - name: Run Phase 2 acceptance checks
        run: make phase2-acceptance

      - name: Run tests
        run: make test
