[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "peoples-ledger"
version = "0.1.0"
description = "Initial proof of concept for The People's Ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License decision deferred" }
authors = [{ name = "The People's Ledger maintainers" }]

[project.scripts]
peoples-ledger = "peoples_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
